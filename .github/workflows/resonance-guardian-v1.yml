name: Resonance original core + Guardian IPC research v1

on:
  push:
    branches: [research/resonance-guardian-appcontainer-ipc-v1]
  pull_request:

permissions:
  contents: read

env:
  INTEGRITY_V4_POLICY_SHA256: ca40a442b148b3571c0dd51a90d9567a8418aa7fd643772ff4b1064dc59aea20

jobs:
  portable:
    name: portable-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Exact original Resonance Core portable tests normal repeat optimized
        shell: bash
        run: |
          python -B -m unittest discover -s research/resonance_guardian_v1/tests -q
          python -B -m unittest discover -s research/resonance_guardian_v1/tests -q
          python -B -O -m unittest discover -s research/resonance_guardian_v1/tests -q
      - name: PR7 layered integrity from independent pin
        shell: bash
        run: python -B tools/integrity_v4.py --policy-sha256 "$INTEGRITY_V4_POLICY_SHA256" --out build/integrity-v4/report.json
      - name: Physical layered integrity mutation controls on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: python -B tools/integrity_mutations_v4.py --policy-sha256 "$INTEGRITY_V4_POLICY_SHA256" --out build/integrity-v4/mutations.json
      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resonance-guardian-portable-${{ matrix.os }}
          path: build/integrity-v4/
          if-no-files-found: warn

  windows-native-assessment:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Report actual native OS capability; never mock PASS
        shell: pwsh
        run: python -B research/resonance_guardian_v1/native_assessment.py --out build/resonance-ipc-v1-hosted
      - name: Surface physical enforcement status without claiming universal PASS
        shell: pwsh
        run: |
          $result = Get-Content build/resonance-ipc-v1-hosted/assessment.json -Raw | ConvertFrom-Json
          Write-Host "Native AppContainer verdict: $($result.status)"
          if ($result.status -ne 'VERIFIED_LOCAL_NATIVE_IPC') {
            Write-Warning 'Physical IPC proof NOT_COVERED in hosted CI. Production remains HOLD.'
          }
      - name: Upload actual native result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resonance-guardian-native-windows
          path: build/resonance-ipc-v1-hosted/
          if-no-files-found: error

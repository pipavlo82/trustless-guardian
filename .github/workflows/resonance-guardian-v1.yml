name: Resonance original core + Guardian IPC research v1 (historical manual replay)

# Historical V1 baseline remains available on demand, not as a promotion gate
# for the distinct Guardian RC3 / Resonance Core V2.3 research candidate.
# Integrity-v8 remains enforced by its other security workflows; this does not
# constitute integrity admission or production approval for RC3.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  INTEGRITY_V4_POLICY_SHA256: 9bc5fd0be81c67cee5f5561c7d26ad657695025857bc27cd04b3f28e09c9b4bc
  INTEGRITY_V8_POLICY_SHA256: 44db7457272224e56603239cc3d64375d1fbcb5de620a7e2ce7253801a9c066d
  INTEGRITY_V8_VERIFIER_SHA256: 5d6ce0885ea0862ab079960e9f22c6e6ace7e141006aeaaeba38ea0e1dbcc4e6

jobs:
  portable:
    name: portable-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Exact original Resonance Core portable tests normal repeat optimized
        shell: bash
        run: |
          python -B -m unittest discover -s research/resonance_guardian_v1/tests -q
          python -B -m unittest discover -s research/resonance_guardian_v1/tests -q
          python -B -O -m unittest discover -s research/resonance_guardian_v1/tests -q
      - name: Version-specific integrity gate (historical v4 or current v8)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f integrity/v8/policy.json ]; then
            python -B - <<'PY'
          import hashlib,os,pathlib,sys
          actual=hashlib.sha256(pathlib.Path('tools/integrity_v8.py').read_bytes()).hexdigest()
          if actual != os.environ['INTEGRITY_V8_VERIFIER_SHA256']:
              sys.exit('VERIFIER_BOOTSTRAP_PIN_MISMATCH')
          PY
            python -B tools/integrity_v8.py --policy-sha256 "$INTEGRITY_V8_POLICY_SHA256" --out build/integrity-v8/report.json
          elif [ -f integrity/v5/policy.json ]; then
            echo 'UNROUTED_INTEGRITY_SUCCESSOR: refusing silent fallback to v4' >&2
            exit 1
          else
            python -B tools/integrity_v4.py --policy-sha256 "$INTEGRITY_V4_POLICY_SHA256" --out build/integrity-v4/report.json
          fi
      - name: Physical integrity mutation controls on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f integrity/v8/policy.json ]; then
            python -B tools/integrity_v8.py --policy-sha256 "$INTEGRITY_V8_POLICY_SHA256" --self-test --out build/integrity-v8/mutations.json
          elif [ -f integrity/v5/policy.json ]; then
            echo 'UNROUTED_INTEGRITY_SUCCESSOR' >&2
            exit 1
          else
            python -B tools/integrity_mutations_v4.py --policy-sha256 "$INTEGRITY_V4_POLICY_SHA256" --out build/integrity-v4/mutations.json
          fi
      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resonance-guardian-portable-${{ matrix.os }}
          path: |
            build/integrity-v4/
            build/integrity-v8/
          if-no-files-found: warn

  windows-native-assessment:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Report actual native OS capability; never mock PASS
        shell: pwsh
        run: python -B research/resonance_guardian_v1/native_assessment.py --out build/resonance-ipc-v1-hosted
      - name: Surface physical enforcement status without claiming universal PASS
        shell: pwsh
        run: |
          $result = Get-Content build/resonance-ipc-v1-hosted/assessment.json -Raw | ConvertFrom-Json
          Write-Host "Native AppContainer verdict: $($result.status)"
          if ($result.status -ne 'VERIFIED_LOCAL_NATIVE_IPC') {
            Write-Warning 'Physical IPC proof NOT_COVERED in hosted CI. Production remains HOLD.'
          }
      - name: Upload actual native result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resonance-guardian-native-windows
          path: build/resonance-ipc-v1-hosted/
          if-no-files-found: error

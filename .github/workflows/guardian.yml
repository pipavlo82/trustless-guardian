name: Guardian conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tools/validate_v03.py --portable --out build/ci-portable
  windows-enforcement:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tools/ci_diagnostics.py --out build/ci-diagnostics.json
      - run: python -B tools/ci_entry.py --profile v03 --out build/ci-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-enforcement-logs
          path: |
            build/ci-launch.*
            build/ci-diagnostics.json
            build/ci-windows/*.json
            build/ci-windows/*.stdout
            build/ci-windows/*.stderr
            build/ci-windows/lab-*/**
            build/ci-windows/ownership/**
            build/ci-windows/mutations/report.json
            build/ci-windows/mutations/*/baseline/**
            build/ci-windows/mutations/*/mutated/**
            build/ci-windows/mutations/*/restored/**
            build/ci-windows/normal/**
            build/ci-windows/repeat/**
            build/ci-windows/optimized/**
            build/ci-windows/handle-inheritance/**
            build/ci-windows/harness-crash-control/**
            build/ci-windows/v0/*.json
            build/ci-windows/v0/*.stdout
            build/ci-windows/v0/*.stderr
            build/ci-windows/v0/lab-*/**
            build/ci-windows/v0/mutations/report.json
            build/ci-windows/v02/**/*.json
            build/ci-windows/v02/**/*.stdout
            build/ci-windows/v02/**/*.stderr
            build/ci-windows/mutations-normal/report.json
            build/ci-windows/mutations-normal/*/baseline/**
            build/ci-windows/mutations-normal/*/mutated/**
            build/ci-windows/mutations-normal/*/restored/**
            build/ci-windows/mutations-optimized/report.json

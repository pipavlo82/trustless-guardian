name: Guardian conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  GUARDIAN_TRANSITION_PIN: cb5bbe2089e37211b0b222bd8c79dc9d986b1d69a9e6dd915c253b386f14d324
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full current and frozen gates
        run: python -B tools/stack_replay_v1.py --pin "$GUARDIAN_TRANSITION_PIN" --out build/stack-portable
      - name: Targeted negative and physical controls
        run: python -B tools/stack_controls_v1.py --pin "$GUARDIAN_TRANSITION_PIN" --out build/stack-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-transition-evidence
          path: build/stack-*/**
          if-no-files-found: error
  windows-enforcement:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tools/prepare.py
      - run: python -B tools/ci_diagnostics.py --out build/ci-diagnostics.json
      - name: Frozen diagnostics (historical failures remain evidence)
        run: |
          python -B tools/v04_ci_probe.py --out build/v04-ci-probe.json
          python -B tools/v04_startup_probe.py --out build/v04-startup-probe.json
      - name: Source-bound PR2 Windows gate through verified child startup
        run: python -B tools/stack_replay_v1.py --pin "$env:GUARDIAN_TRANSITION_PIN" --native --out build/stack-windows
      - name: Transition and negative controls
        run: python -B tools/stack_controls_v1.py --pin "$env:GUARDIAN_TRANSITION_PIN" --out build/stack-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-transition-evidence
          path: |
            build/stack-*/**
            build/ci-diagnostics.json
            build/v04-ci-probe.json
            build/v04-startup-probe.json
          if-no-files-found: error

name: Rare-event evidence v0 (synthetic portable)
on:
  push:
    branches:
      - research/rare-event-evidence-v0
  pull_request:
    paths:
      - 'research/rare_event_evidence_v0/**'
      - 'tests/test_rare_event_evidence_v0.py'
      - '.github/workflows/rare-event-evidence-v0.yml'
permissions:
  contents: read
jobs:
  synthetic-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic regression and negative controls
        run: python -B -m unittest discover -s tests -p 'test_rare_event_evidence_v0.py' -v
